# Tip Preparation - simulation / demo configuration
#
# Pair this with the GUI's "Simulate" checkbox (or
# `cargo run --example tip-prep-mock -- realistic`) to drive the full routine
# against the in-memory mock controller. No Nanonis system is contacted.
#
# Timings here are deliberately compressed so a full run finishes in ~1 minute
# instead of the ~1 hour the hardware defaults imply. Everything else matches a
# real configuration, so the values shown in the GUI's Configuration tab are
# exactly the ones the simulated run used.

[nanonis]
host_ip = "127.0.0.1"
control_ports = [6501, 6502, 6503, 6504]

[data_acquisition]
data_port = 6590
sample_rate = 2000

# Samples averaged into each stable read. One read is one measurement, and one
# plotted point — the batch only sets how tightly that value is determined
# (its std dev rides along on the event for an error bar).
stable_signal_samples = 64

[experiment_logging]
enabled = true
output_path = "./experiments"

[console]
verbosity = "info"

[tip_prep]
# Frequency shift window (Hz) that counts as a sharp tip.
sharp_tip_bounds = [-2.0, 0.0]

# Conditioning is a random search, not a convergent process: each pulse re-rolls
# the apex, and the run ends when a draw happens to land in the window above.
# That takes O(100) pulses and varies a lot run to run (the reference data set
# needed 287 pulses once and 9 another time), so the limit has to be generous.
max_cycles = 600

[tip_prep.signal_stability]
# Gates on each batch. The mock's per-sample scatter (0.25 Hz) sits well inside
# max_std_dev_hz, so reads pass without spending the run in retry backoff.
max_std_dev_hz = 1.0
max_slope_hz_per_s = 20.0
read_retry_count = 1

[tip_prep.timing]
pulse_width_ms = 50
post_approach_settle_ms = 100
post_reposition_settle_ms = 100
buffer_clear_wait_ms = 50
post_pulse_settle_ms = 100
reposition_steps = [2, 2]
status_interval = 5

[tip_prep.stability]
check_stability = true
stable_tip_allowed_change = 0.2
bias_range = [0.01, 2.0]

# 20 steps x 20 ms per sweep, vs the hardware default of 1000 x 200 ms
# (which would be 200 s per sweep, 400 s for both polarities).
bias_steps = 20
step_period_ms = 20

max_duration_secs = 100
polarity_mode = "both"
scan_speed_m_s = 5e-9

[pulse_method]
# Linear maps the measured frequency shift onto a pulse voltage, so the voltage
# history tracks the freq-shift trajectory cycle by cycle. Stepping would sit
# flat at the minimum for a steadily improving tip (it only ramps after
# consecutive cycles *without* improvement), which makes for a dull plot.
type = "linear"
voltage_bounds = [2.0, 7.0]
linear_clamp = [-20.0, 0.0]
polarity = "positive"

# Left off for the demo: an alternating polarity would put sign flips in the
# voltage plot, which is harder to read at poster scale.
# [pulse_method.random_polarity_switch]
# enabled = true
# switch_every_n_pulses = 5
