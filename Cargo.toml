[package]
name = "rusty-tip"
version = "0.4.0"
edition = "2024"
description = "Write controller-agnostic scanning probe microscopy automation in Rust, starting with automated tip preparation on Nanonis systems"
repository = "https://github.com/kronberger-droid/rusty-tip"
license = "MIT"
authors = ["Martin Kronberger <kronberger@proton.me>"]

[lib]
name = "rusty_tip"
path = "src/lib.rs"

[[bin]]
name = "tip-prep"
path = "bin/tip-prep/main.rs"

[[bin]]
name = "cuox-finder"
path = "bin/cuox-finder/main.rs"

[[bin]]
name = "tip-prep-gui"
path = "bin/tip-prep-gui/main.rs"
required-features = ["gui"]

[dependencies]
nanonis-rs = "0.4.0"
byteorder = "1.5"
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"
textplots = "0.8"
serde = { version = "1.0", features = [ "derive" ] }
chrono = { version = "0.4.42", features = [ "serde" ] }
serde_json = "1.0"
ndarray = "0.16.1"
ctrlc = "3.4"
parking_lot = "0.12"
config = { version = "0.15.18", features = [ "toml" ] }
clap = { version = "4.5.53", features = ["derive"] }
crossbeam-channel = "0.5"
ureq = { version = "3", features = [ "json" ] }
rayon = "1.10"
image = "0.25"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["consoleapi", "processenv", "wincon", "handleapi", "winbase"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.33", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_plot = { version = "0.34", optional = true }
rfd = { version = "0.17", optional = true }
toml = { version = "0.8", optional = true }

[features]
default = []
gui = ["eframe", "egui_plot", "rfd", "toml"]

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Routines run with the tip at the surface; a panic mid-routine is the
# worst failure mode this library has. catch_unwind in run_routine bounds
# the damage, these lints shrink the probability. Tests are exempt via
# clippy.toml.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
exit = "deny"
string_slice = "deny"
unchecked_time_subtraction = "deny"
# -- Wanted, but need larger changes first (hit counts from 2026-08-12) --
# indexing_slicing = "deny"        # ~150 hits: Frame accessors, cuox_rows SAT math
# arithmetic_side_effects = "deny" # ~150 hits: mostly cuox_rows index arithmetic
# as_conversions = "deny"          # ~220 hits: f32/f64 boundary; finer cast_* lints instead
# pedantic = { level = "warn", priority = -1 }  # triage before enabling: CI denies warnings
