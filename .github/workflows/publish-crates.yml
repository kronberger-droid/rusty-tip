# Publishes the library to crates.io once a version tag's release has built.
#
# release.yml (cargo-dist) builds the binaries and creates the GitHub Release
# from the tag. This waits for it to finish and publishes only if it
# succeeded: `cargo publish` cannot be undone, so a tag whose Windows build
# fails must not reach crates.io first. Chained with `workflow_run` rather
# than a cargo-dist publish job, so release.yml stays exactly what dist
# generates.
#
# `workflow_run` runs this file as it is on the default branch and checks out
# the commit the release was built from.
#
# Requires a CARGO_REGISTRY_TOKEN secret in the repository settings.
name: Publish to crates.io

on:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    # Release also runs on pull requests, as a plan-only check. Only a
    # successful run from a tag push publishes; for those, the run's branch
    # is the tag.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: dtolnay/rust-toolchain@stable
      # --locked builds against the committed Cargo.lock; the version published
      # is whatever is in Cargo.toml (cargo-dist's plan job already enforces
      # that the tag matches that version).
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
